<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feid</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0c0c0c;
      --text-white: #f5f5f5;
      --text-gray: #888888;
      --border-color: rgba(255, 255, 255, 0.7);
      --accent-glow: rgba(255, 255, 255, 0.15);
      --bleach-fill-img: url('https://i.postimg.cc/V6XhwsQM/imw-5000-imh-5000-ima-fit-impolicy-Letterbox-imcolor-000000-letterbox-false.gif');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0c0c0c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 450px;
      background: var(--bg-color);
      overflow: hidden;
      box-shadow: 0 0 0px rgba(0,0,0,0.9);
    }

    @media (max-width: 480px) {
      .viewport {
        max-height: 100vh;
        max-width: 100vw;
      }
    }

    .slider-track {
      width: 100%;
      height: 200%;
      display: flex;
      flex-direction: column;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .slider-track.slide-up {
      transform: translateY(-50%);
    }

    .screen {
      position: relative;
      width: 100%;
      height: 50%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
    }

    /* PANTALLA 1 */
    .screen-bleach {
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
    }

    .bleach-eyes-box {
      width: 220px;
      height: 50px;
      border: 1.5px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 14px;
      background: #000;
    }

    .bleach-eyes-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(150%);
    }

    .bleach-studio-title {
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      line-height: 1.1;
      color: #2E2E2E;
    }

    .bleach-studio-sub {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #2E2E2E;
      margin-bottom: 15px;
    }

    .bleach-main-title {
      font-family: 'Oswald', sans-serif;
      font-size: 6rem;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      background-image: var(--bleach-fill-img);
      background-size: cover;
      background-position: center;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: grayscale(|00%) contrast(190%);
      margin-bottom: 8px;
    }

    .bleach-katakana {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.001em;
      color: #696969;
      margin-left: 0.25em;
      margin-bottom: 35px;
    }

    .bleach-footer-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #969696;
    }

    .bleach-footer-kanji {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.4em;
      color: var(--text-gray);
      margin-top: 4px;
    }

    .tap-hint {
      margin-top: 30px;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: #555;
      animation: blink 1.6s infinite ease-in-out;
    }

    /* PANTALLA 2 */
    .screen-jujutsu {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text-white);
      overflow: hidden;
    }

    .jjk-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .jjk-topbar .brand {
      font-weight: 900;
      letter-spacing: 0.7em; 
      color: var(--text-gray);
    }

    .jjk-topbar-sub {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-gray);
      margin-bottom: 8px;
    }

    .jjk-layout-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 10px;
      flex: 1;
    }

    .jjk-col-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-border {
      border: 1px solid var(--border-color);
      overflow: hidden;
      background: #000;
      position: relative;
      cursor: pointer;
    }

    .img-box-square {
      width: 100%;
      height: 110px;
    }

    .img-box-square img,
    .img-box-tall img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(130%) blur(0px);
      display: block;
      transition: filter 0.45s ease, transform 0.45s ease;
      will-change: filter, transform;
    }

    .card-border:hover img {
      filter: grayscale(0%) contrast(100%) blur(2.5px);
      transform: scale(1.04);
    }

    .section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 0.08em;
      margin: 2px 0;
    }

    .quote-text {
      font-size: 0.52rem;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #ccc;
    }

    .jjk-col-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .img-box-tall {
      width: 100%;
      height: 220px;
    }

    .right-bottom-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    /* REPRODUCTOR */
    .player-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.55rem;
      color: var(--text-gray);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .track-title {
      font-size: 0.55rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.05em;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .ctrl-btn {
      background: none;
      border: .5px solid rgba(255, 255, 255, 0.3);
      color: #9D9696;
      font-size: 0.65rem;
      padding: 3px 6px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s ease;
      flex: 1;
      text-align: center;
    }

    .ctrl-btn:hover {
      background: #141313;
      color: #000;
    }

    .ctrl-btn.play-btn {
      background: rgba(255, 255, 255, 0.15);
      border-color: #fff;
      font-weight: bold;
    }

    /* LINKS MINI */
    .mini-links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .mini-link-btn {
      text-align: center;
      background: rgba(0, 0,0, 0.05);
      border: 0px solid var(--border-color);
      color: #696969;
      text-decoration: none;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 5px 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      border-radius: 2px;
      display: block;
    }

    .mini-link-btn:hover {
      background: #2E2E2E;
      color: #000;
    }

    .jjk-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.55rem;
      color: #1C1B1B;
      margin-top: 6px;
    }

    .back-action {
      background: none;
      border: none;
      color: var(--text-gray);
      cursor: pointer;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .back-action:hover {
      color: #fff;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="slider-track" id="slider">

      <!-- PANTALLA 1 -->
      <section class="screen screen-bleach" id="screen1">
        <div class="bleach-eyes-box">
          <img src="https://i.postimg.cc/FF3QGG24/a03372fdbda4d55787ea2133d1ee38ba.jpg" alt="Eyes Banner" />
        </div>

        <p class="bleach-studio-title">FEID</p>
        <p class="bleach-studio-sub">16699</p>

        <h1 class="bleach-main-title">DOOM</h1>
        <div class="bleach-katakana">ドゥーム</div>

        <div>
          <h2 class="bleach-footer-name"> FREAK</h2>
          <p class="bleach-footer-kanji">☐☐☐</p>
        </div>

        <div class="tap-hint"> ▲</div>
      </section>

      <!-- PANTALLA 2 -->
      <section class="screen screen-jujutsu" id="screen2">
        <div>
          <div class="jjk-topbar">
            <span class="brand"></span>
            <span>ドゥーム</span>
          </div>
          <div class="jjk-topbar-sub">
            <span>FEID</span>
            <span>16699</span>
          </div>

          <div class="jjk-layout-grid">
            <div class="jjk-col-left">
              <div class="card-border img-box-square">
                <img src="https://i.pinimg.com/736x/32/68/05/32680514b126b3ca2c953d2867cda892.jpg" alt="Guts Eyes" />
              </div>
              
              <h2 class="section-title">DOOM</h2>
              
              <p class="quote-text">
                THAT'S WHY YOU HAVE TO ENJOY LIFE. EVEN IF IT'S SELFISH — YOU NEED TO FIND YOUR REASON TO LIVE.<br>
                <strong>THROUGHOUT HEAVEN AND EARTH I ALONE AM THE HONOURED ONE</strong>
              </p>

              <div class="card-border img-box-square">
                <img src="https://i.postimg.cc/gkjC7Zkn/giphy.gif" alt="Guts Kneeling" />
              </div>
            </div>

            <div class="jjk-col-right">
              <div class="card-border img-box-tall">
                <img src="https://i.postimg.cc/9Q1T8MZm/Guts-Wallpapers.jpg" alt="Guts Standing" />
              </div>

              <div class="right-bottom-panel">
                
                <!-- Reproductor -->
                <div class="player-container">
                  <div class="player-header">
                    <span>AUDIO TRACK</span>
                    <span id="track-number">01 / 03</span>
                  </div>
                  <div class="track-title" id="track-name">Track 01</div>
                  
                  <div class="player-controls">
                    <button class="ctrl-btn" id="prevBtn">⏮</button>
                    <button class="ctrl-btn play-btn" id="playBtn">▶</button>
                    <button class="ctrl-btn" id="nextBtn">⏭</button>
                  </div>
                </div>

                <!-- Links -->
                <div class="mini-links-grid">
                  <a href="http://xat.me/FEID" target="_blank" class="mini-link-btn">▫︎</a>
                  <a href="http://xat.me/FEID" target="_blank" class="mini-link-btn">▫︎</a>
                   <a href="http://xat.me/FEID" target="_blank" class="mini-link-btn">▫︎</a>
                  <a href="http://xat.me/FEID" target="_blank" class="mini-link-btn">▫︎</a>
                </div>

              </div>

            </div>

          </div>
        </div>

        <div class="jjk-footer">
          <button class="back-action" id="btnBack">▲</button>
          <span>© HEADACHE</span>
        </div>

      </section>

    </div>
  </div>

  <!-- Elemento de audio nativo -->
  <audio id="audio-engine"></audio>

  <script>
    // Slider
    const slider = document.getElementById('slider');
    const screen1 = document.getElementById('screen1');
    const btnBack = document.getElementById('btnBack');

    screen1.addEventListener('click', () => slider.classList.add('slide-up'));
    btnBack.addEventListener('click', (e) => {
      e.stopPropagation();
      slider.classList.remove('slide-up');
    });

    /* ==========================================================================
       PLAYLIST: Reemplaza las URLs 'url' por tus archivos .mp3 o audios directos
       ========================================================================== */
    const playlist = [
      {
        title: "Just like Heaven - The Cure",
        url: "https://dl.dropbox.com/scl/fi/zo0scta58m3nre3hu6xco/Just-Like-Heaven.mp3?rlkey=jssc7rfu6fp15na7tejaprkdj&st=ggr4kef6&dl=0"
      },
      {
        title: "Imagination - Foster the People",
        url: "https://dl.dropbox.com/scl/fi/qpxvueq07umk2pkxfqs1h/Foster-The-People-Imagination-Sub.-Espa-ol.mp3?rlkey=6ia6jkl4jr5y7hapmypjallkg&st=utp7j1kv&dl=0"
      },
      {
        title: "Selfless - The Strokes",
        url: "https://dl.dropbox.com/scl/fi/7ite659147mqi7gzpvbfk/The-Strokes-Selfless-Sub-Espa-ol-_HD_-128-kbps.mp3?rlkey=euisvoed681p1y24ka5wt3b9n&st=upkjg9us&dl=0"
      }
    ];

    let currentTrack = 0;
    const audio = document.getElementById('audio-engine');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackName = document.getElementById('track-name');
    const trackNumber = document.getElementById('track-number');

    function loadTrack(index, autoplay = true) {
      currentTrack = index;
      audio.src = playlist[currentTrack].url;
      trackName.textContent = playlist[currentTrack].title;
      trackNumber.textContent = `0${currentTrack + 1} / 0${playlist.length}`;
      
      if (autoplay) {
        audio.play().then(() => {
          playBtn.textContent = '⏸';
        }).catch(() => {
          playBtn.textContent = '▶';
        });
      }
    }

    // Inicializar primer track
    loadTrack(0, true);

    // Eventos de control
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '⏸';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      let nextIndex = (currentTrack + 1) % playlist.length;
      loadTrack(nextIndex, true);
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      let prevIndex = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(prevIndex, true);
    });

    // Pasar a la siguiente canción al terminar
    audio.addEventListener('ended', () => {
      let nextIndex = (currentTrack + 1) % playlist.length;
      loadTrack(nextIndex, true);
    });
  </script>
</body>
</html>
